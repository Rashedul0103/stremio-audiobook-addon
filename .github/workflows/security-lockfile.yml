name: Temporary security lockfile regeneration

on:
  push:
    branches:
      - security/npm-overrides-2026-10-15

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate lockfile for security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Confirm clean locked installation
        run: npm ci
      - name: Report dependency audit
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('COUNTS', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              isDirect: vulnerability.isDirect,
              range: vulnerability.range,
              fixAvailable: vulnerability.fixAvailable,
              via: (vulnerability.via || []).map(item =>
                typeof item === 'string'
                  ? item
                  : { name: item.name, title: item.title, url: item.url, range: item.range }
              )
            }));
          }
          NODE
      - name: Run project checks, tests, and audit gate
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          npm run check && npm test && npm audit --audit-level=low
      - name: Commit lockfile update and remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/security-lockfile.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were generated."
            exit 0
          fi
          git commit -m "fix: remediate vulnerable npm dependencies"
          git push origin HEAD:security/npm-overrides-2026-10-15
      - name: Mark failed validation
        if: steps.validate.outcome == 'failure'
        run: exit 1
