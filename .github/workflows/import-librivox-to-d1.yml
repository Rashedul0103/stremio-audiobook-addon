name: Import LibriVox catalogue into D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: librivox-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare database and secrets
        run: node scripts/validate-cloudflare-config.mjs worker/wrangler.jsonc --require-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fetch public LibriVox catalogue repository
        run: git clone --depth 1 https://github.com/Rashedul0103/librivox_audiobooks.git "$RUNNER_TEMP/librivox_audiobooks"

      - name: Build D1 import batches
        run: node scripts/build-librivox-d1-import.mjs "$RUNNER_TEMP/librivox_audiobooks" "$RUNNER_TEMP/librivox-d1-import"
        env:
          LIBRIVOX_ENRICH_COVERS: "1"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      # Apply schema changes using the Deploy Worker workflow before importing.
      # This workflow intentionally avoids an extra remote D1 migration query.
      - name: Import generated SQL batches
        shell: bash
        run: |
          shopt -s nullglob
          files=( "$RUNNER_TEMP/librivox-d1-import"/*.sql )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No SQL batches were generated."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Importing $(basename "$file")"
            wrangler d1 execute librivox-audiobooks --remote --config worker/wrangler.jsonc --file "$file"
          done
          echo "Import complete."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify remote D1 matches the import snapshot
        run: node scripts/verify-d1-import.mjs "$RUNNER_TEMP/librivox-d1-import/summary.json" "$RUNNER_TEMP/librivox-d1-import/remote-verification.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload import and remote verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librivox-d1-import-verification
          path: |
            ${{ runner.temp }}/librivox-d1-import/summary.json
            ${{ runner.temp }}/librivox-d1-import/remote-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Print import summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/librivox-d1-import/summary.json" ]; then
            cat "$RUNNER_TEMP/librivox-d1-import/summary.json"
          else
            echo "Import summary was not produced."
          fi
