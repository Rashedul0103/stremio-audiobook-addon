name: Temporary dependency remediation

on:
  push:
    branches:
      - security/dependency-remediation-2026-10-15

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated remediation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lockfile as baseline
        run: npm ci
      - name: Apply compatible, non-force security updates
        shell: bash
        run: |
          set +e
          npm audit fix
          AUDIT_FIX_EXIT=$?
          echo "npm audit fix exit code: $AUDIT_FIX_EXIT"
          exit 0
      - name: Print exact post-fix audit advisories
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('COUNTS', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              isDirect: vulnerability.isDirect,
              range: vulnerability.range,
              fixAvailable: vulnerability.fixAvailable,
              via: (vulnerability.via || []).map(item =>
                typeof item === 'string'
                  ? item
                  : { name: item.name, title: item.title, url: item.url, range: item.range }
              )
            }));
          }
          NODE
      - name: Run syntax checks and regression suite
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          npm run check && npm test
      - name: Commit generated lockfile updates and remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/remediate-dependencies.yml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: apply compatible npm security updates"
          git push origin HEAD:security/dependency-remediation-2026-10-15
      - name: Mark validation failures
        if: steps.validate.outcome == 'failure'
        run: exit 1
